# simple-motd configuration. Changes apply at the next login (THEME, WIDTH)
# or within a minute (SSH_MODE needs `install.sh --ssh <mode>` to switch).

# Colours: pink, blue, green or orange (also used by the prompt).
THEME=pink

# Where the screen shows: "ssh" (SSH logins), or "ssh local" to also show it in every new
# local terminal (Konsole, GNOME Terminal...): set with install.sh --local / --no-local.
# A user can set SHOW and THEME for themselves in ~/.config/simple-motd.conf.
SHOW="ssh"

# Where the SSH attempts are counted from:
#   journal  the journal of the sshd unit, or /var/log/auth.log / /var/log/secure
#   private  sshd logs only to RAM, reduced every minute to "ok"/"fail": no address kept
#   off      no ssh line
SSH_MODE=journal

# Width of the header line, in columns.
WIDTH=66

# File systems in the usage part: empty for every local data file system (/ first,
# no Docker, snap or /boot), or a list of mount points, e.g. DISKS="/ /srv/media".
DISKS=""
# At most this many disk lines; the others are counted on one line.
MAX_DISKS=6

# The docker part: auto (when docker is installed) or off.
DOCKER=auto
