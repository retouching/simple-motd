# simple-motd configuration. Changes apply at the next login (THEME, WIDTH)
# or within a minute (SSH_MODE needs `install.sh --ssh <mode>` to switch).

# Colours: pink, blue, green or orange (also used by the prompt).
THEME=pink

# Where the SSH attempts are counted from:
#   journal  the journal of the sshd unit, or /var/log/auth.log / /var/log/secure
#   private  sshd logs only to RAM, reduced every minute to "ok"/"fail": no address kept
#   off      no ssh line
SSH_MODE=journal

# Width of the header line, in columns.
WIDTH=66
